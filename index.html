<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: barra de estado fija arriba (nivel, XP, racha, escamas) + vista única que cambia: mapa serpenteante de mundos, reto, juegos, logros, consola. Colores de Python: azul tinta y amarillo. */
:root{
  --bg:#EDF1F8; --surface:#FFFFFF; --sunk:#E3E9F3; --ink:#14213A; --muted:#56657F; --line:#D2DBEA;
  --blue:#2F6DB0; --blue-ink:#FFFFFF; --yellow:#F2C230; --yellow-ink:#2A2100;
  --good:#1B8A5E; --good-bg:#DDF3EA; --bad:#C23B3B; --bad-bg:#FBE3E3;
  --code-bg:#14213A; --code-ink:#E6EDF8; --code-muted:#7F8FAD;
  --f-display:"Bungee", "Impact", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1626; --surface:#17223A; --sunk:#111B2E; --ink:#E7EDF8; --muted:#94A3BF; --line:#27375A;
  --blue:#5E9EE6; --blue-ink:#0B1424; --yellow:#FFD43B; --yellow-ink:#2A2100;
  --good:#45C08C; --good-bg:#12352A; --bad:#EF7272; --bad-bg:#3A1A20;
  --code-bg:#0A1120; --code-ink:#E6EDF8; --code-muted:#6E7E9C; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#17223A; --sunk:#111B2E; --ink:#E7EDF8; --muted:#94A3BF; --line:#27375A;
  --blue:#5E9EE6; --blue-ink:#0B1424; --yellow:#FFD43B; --yellow-ink:#2A2100;
  --good:#45C08C; --good-bg:#12352A; --bad:#EF7272; --bad-bg:#3A1A20;
  --code-bg:#0A1120; --code-ink:#E6EDF8; --code-muted:#6E7E9C; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
code,pre,.mono{font-family:var(--f-mono)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-size:22px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.logo span{color:var(--blue)} .logo b{color:var(--yellow);-webkit-text-stroke:1px var(--ink);font-weight:400}
.stats{display:flex;align-items:center;gap:14px;margin-left:auto;flex-wrap:wrap}
.lvl{display:flex;align-items:center;gap:10px;min-width:0}
.lvl-badge{font-family:var(--f-display);background:var(--blue);color:var(--blue-ink);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:17px;flex:none}
.lvl-txt{display:flex;flex-direction:column;min-width:130px}
.lvl-txt small{color:var(--muted);font-size:12px;line-height:1.2}
.lvl-txt strong{font-size:14px;line-height:1.3}
.xpbar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:var(--yellow);border-radius:99px;transition:width .6s ease}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;padding:6px 10px;border-radius:99px;background:var(--sunk)}
.pill svg{width:18px;height:18px}
nav.tabs{display:flex;gap:4px;width:100%;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:8px 14px;border-radius:10px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-current="true"]{background:var(--sunk);color:var(--ink)}
main{padding-block:24px 64px}

/* ---------- Mapa ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-bottom:28px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5vw,44px);letter-spacing:.5px}
.hero p{color:var(--muted);max-width:60ch;margin:8px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--sunk);color:var(--ink);transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--yellow);color:var(--yellow-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--yellow) 55%,#000)}
.btn.blue{background:var(--blue);color:var(--blue-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.btn.ghost{background:none;border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}

.world{margin-bottom:34px}
.world-head{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.world-head .num{font-family:var(--f-display);font-size:28px;color:var(--blue);line-height:1;width:44px;text-align:center;flex:none}
.world-head h2{font-size:19px;font-weight:800}
.world-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.world-head .prog{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:14px;white-space:nowrap}
.world.locked .world-head{opacity:.6}
.world.locked .world-head .num{color:var(--muted)}
.trail{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 0 6px}
.node{--x:0px;transform:translateX(var(--x));display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;max-width:100%}
.node .disc{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);transition:transform .15s}
.node .disc svg{width:28px;height:28px}
.node .lab{font-size:13px;font-weight:600;color:var(--muted);max-width:150px;text-align:center;line-height:1.25}
.node.open .disc{background:var(--blue);border-color:var(--blue);color:var(--blue-ink);box-shadow:0 5px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.node.done .disc{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink);box-shadow:0 5px 0 color-mix(in srgb,var(--yellow) 55%,#000)}
.node.open .lab,.node.done .lab{color:var(--ink)}
.node.next .disc{animation:bob 1.6s ease-in-out infinite}
.node:not(:disabled):hover .disc{transform:translateY(-2px)}
.node:disabled{cursor:not-allowed}
.node .kind{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
@keyframes bob{50%{transform:translateY(-5px)}}

/* ---------- Reto ---------- */
.crumbs{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.crumbs .steps{display:flex;gap:6px;margin-left:auto}
.crumbs .steps i{width:26px;height:8px;border-radius:99px;background:var(--line)}
.crumbs .steps i.d{background:var(--yellow)} .crumbs .steps i.c{background:var(--blue)}
.challenge{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--blue)}
.panel h2{font-size:24px;font-weight:800;margin:4px 0 10px}
.theory p{margin:0 0 12px;max-width:65ch}
.theory code{background:var(--sunk);padding:1px 6px;border-radius:6px;font-size:.9em}
.snippet{background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:12px 14px;font-size:14px;overflow-x:auto;margin:0 0 12px;white-space:pre;line-height:1.5}
.task{border-top:1px dashed var(--line);padding-top:14px;margin-top:6px}
.task h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.task p{margin:0;font-weight:600}
.reward{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.reward span{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}

.editor{display:flex;background:var(--code-bg);border-radius:12px;overflow:hidden;min-height:220px;border:1px solid var(--line)}
.gutter{padding:12px 8px 12px 12px;color:var(--code-muted);font-family:var(--f-mono);font-size:14px;line-height:1.6;text-align:right;user-select:none;white-space:pre;overflow:hidden}
.editor textarea{flex:1;min-width:0;background:transparent;color:var(--code-ink);border:0;resize:vertical;padding:12px;font-family:var(--f-mono);font-size:14px;line-height:1.6;tab-size:4;white-space:pre;overflow:auto;min-height:220px;outline:none}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.toolbar .spacer{flex:1}
.console{background:var(--sunk);border-radius:12px;padding:12px 14px;font-family:var(--f-mono);font-size:14px;white-space:pre-wrap;word-break:break-word;min-height:64px;line-height:1.5}
.console .ph{color:var(--muted);font-family:var(--f-body)}
.console.err{background:var(--bad-bg);color:var(--bad)}
.feedback{margin-top:12px;border-radius:12px;padding:14px 16px;font-weight:600;display:flex;gap:12px;align-items:flex-start}
.feedback.ok{background:var(--good-bg);color:var(--good)}
.feedback.ko{background:var(--bad-bg);color:var(--bad)}
.feedback .body{flex:1;min-width:0;white-space:pre-wrap}
.feedback .body small{display:block;font-weight:500;color:var(--ink);opacity:.85;margin-top:4px}
.hintbox{margin-top:12px;border:1.5px dashed var(--yellow);border-radius:12px;padding:12px 14px;font-size:15px}
.hintbox pre{margin:8px 0 0}

.options{display:grid;gap:10px;margin-top:6px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-family:var(--f-mono);font-size:15px;display:flex;gap:12px;align-items:center;box-shadow:0 3px 0 var(--line)}
.opt .k{font-family:var(--f-body);font-weight:800;width:26px;height:26px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-size:13px;flex:none}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}

/* ---------- Juegos ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.game-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px}
.game-card h2{font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.4px}
.game-card p{margin:0;color:var(--muted)}
.game-card .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.game-card .art{height:96px;border-radius:12px;background:var(--code-bg);color:var(--code-ink);font-family:var(--f-mono);font-size:13px;padding:12px 14px;overflow:hidden;white-space:pre;position:relative}
.game-card .art .y{color:var(--yellow)} .game-card .art .b{color:#8DBCF0}

.ta-top{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.timer{font-family:var(--f-display);font-size:34px;font-variant-numeric:tabular-nums;color:var(--blue);min-width:70px}
.timer.low{color:var(--bad)}
.timebar{flex:1;min-width:140px;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.timebar i{display:block;height:100%;background:var(--blue);transition:width 1s linear}
.score{font-family:var(--f-display);font-size:22px}
.combo{font-weight:800;color:var(--yellow-ink);background:var(--yellow);padding:4px 10px;border-radius:99px;font-size:14px}
.flash-ok{animation:fok .35s} .flash-ko{animation:fko .35s}
@keyframes fok{30%{box-shadow:0 0 0 4px var(--good)}} @keyframes fko{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.big-result{text-align:center;padding:28px 10px}
.big-result .n{font-family:var(--f-display);font-size:72px;line-height:1;color:var(--blue)}
.big-result p{color:var(--muted)}

.parsons{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.plist{display:flex;flex-direction:column;gap:8px;min-height:120px;background:var(--sunk);border-radius:12px;padding:10px;border:2px dashed var(--line)}
.plist.target{background:var(--code-bg);border-color:transparent}
.piece{text-align:left;font-family:var(--f-mono);font-size:14px;white-space:pre;overflow-x:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;box-shadow:0 2px 0 var(--line)}
.plist.target .piece{background:color-mix(in srgb,var(--code-bg) 80%,var(--blue));color:var(--code-ink);border-color:color-mix(in srgb,var(--code-bg) 60%,var(--blue));box-shadow:none}
.plist .empty{color:var(--muted);font-size:14px;padding:6px;text-align:center}
.plist.target .empty{color:var(--code-muted)}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ptabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600}
.ptabs button[aria-current="true"]{border-color:var(--blue);color:var(--blue)}
.ptabs button.done::after{content:" ✓";color:var(--good)}

/* ---------- Logros ---------- */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.ach{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center}
.ach .medal{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.ach .medal svg{width:26px;height:26px}
.ach.on .medal{background:var(--yellow);color:var(--yellow-ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--yellow) 35%,transparent)}
.ach h3{font-size:16px;font-weight:800}
.ach p{margin:2px 0 0;color:var(--muted);font-size:14px;line-height:1.35}
.ach:not(.on) h3{color:var(--muted)}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:26px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:28px;display:block;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-weight:600}
.section-title{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 14px;letter-spacing:.4px}

/* ---------- Toasts y confeti ---------- */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:30;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .3s ease;display:flex;align-items:center;gap:10px;max-width:320px}
.toast.gold{background:var(--yellow);color:var(--yellow-ink)}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:29;width:100%;height:100%}
.tag-clase{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue);vertical-align:1px;white-space:nowrap}
.inputs-note{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.inputs-box{width:100%;min-height:72px;background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--f-mono);font-size:14px;resize:vertical}
.exam-rules{margin:12px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.exam-rules li{margin-bottom:4px}
.notice{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-weight:600}

@media (max-width:820px){
  .challenge,.parsons{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:1fr}
  .lvl-txt{min-width:110px}
}
@media (max-width:520px){
  .stats{margin-left:0;width:100%;justify-content:space-between;gap:8px}
  .world-head{flex-wrap:wrap}
  .world-head .prog{margin-left:58px}
  .node .disc{width:60px;height:60px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

   theory:`<p>Una <b>clase</b> es un molde para crear objetos con datos (atributos) y acciones (métodos). <code>__init__</code> se ejecuta al crear el objeto.</p><pre class="snippet">class Lampara:\n    def __init__(self):\n        self.encendida = False\n    def pulsar(self):\n        self.encendida = not self.encendida</pre>`,

   check:{cases:[{tests:`r = Rectangulo(3, 4)\nassert r.area() == 12, "El área de 3x4 es 12"\nassert r.perimetro() == 14, "El perímetro de 3x4 es 14"\nc = Cuadrado(5)\nassert c.area() == 25, "El área de un cuadrado de lado 5 es 25"\nassert isinstance(c, Rectangulo), "Cuadrado debe heredar de Rectangulo"`}]},

   solution:"def doble(func):\n    def envoltura(*args):\n        return 2 * func(*args)\n    return envoltura\n\n@doble\ndef suma(a, b):\n    return a + b"},

   task:"Escribe agrupar(palabras): un diccionario cuya clave es la primera letra y cuyo valor es la lista ordenada de palabras que empiezan por ella.",
   starter:"def agrupar(palabras):\n    pass\n",
   check:{cases:[{tests:`r = agrupar(["pera", "manzana", "kiwi", "pomelo", "mango"])\nassert r == {"p": ["pera", "pomelo"], "m": ["mango", "manzana"], "k": ["kiwi"]}, "Resultado: " + str(r)\nassert agrupar([]) == {}, "Una lista vacía da un diccionario vacío"`}]},
   hint:"Usa grupos.setdefault(p[0], []).append(p) y al final ordena cada lista.",

 {id:"c5", clase:true, badge:"Práctica de clase", name:"Piedra, papel, tijera, lagarto, Spock", desc:"el proyecto de clase, construido paso a paso", steps:[
  {id:"c5s1", type:"quiz", title:"Las reglas",
   theory:`<p>Cada jugada gana a otras dos:</p><pre class="snippet">tijera  → papel, lagarto\npapel   → piedra, spock\npiedra  → lagarto, tijera\nlagarto → spock, papel\nspock   → tijera, piedra</pre>`,
   code:`# Jugador: spock\n# Ordenador: tijera`, q:"¿Quién gana?",
   options:["Gana Spock","Gana tijera","Empate","Depende de quién empiece"], answer:0,
   explain:"Spock rompe las tijeras. Fíjate en que la tabla ya es casi un diccionario de Python."},
  {id:"c5s2", type:"code", title:"Las reglas en un diccionario",
   theory:`<p>En lugar de escribir 20 <code>if</code>, guarda las reglas en un diccionario: la clave es la jugada y el valor, la lista de jugadas a las que gana. Así el programa es corto y fácil de corregir.</p>`,
   task:"Crea el diccionario gana_a con las 5 jugadas (en minúsculas y sin tildes) y, para cada una, la lista de las dos a las que gana.",
   starter:"gana_a = {\n    \"tijera\": [\"papel\", \"lagarto\"],\n}\n",
   check:{cases:[{tests:`esperado = {"tijera": {"papel", "lagarto"}, "papel": {"piedra", "spock"}, "piedra": {"lagarto", "tijera"}, "lagarto": {"spock", "papel"}, "spock": {"tijera", "piedra"}}\nassert set(gana_a.keys()) == set(esperado.keys()), "Las claves deben ser: piedra, papel, tijera, lagarto, spock"\nfor k in esperado:\n    assert set(gana_a[k]) == esperado[k], k + " debería ganar a " + str(sorted(esperado[k]))`}]},
   hint:"Copia la tabla de la teoría del test anterior: cada fila es una clave.",
   solution:RPSLS_DICT},
  {id:"c5s3", type:"code", title:"¿Quién gana?", exam:true,
   theory:`<p>Con el diccionario, decidir el ganador son tres casos: iguales, el ordenador está en la lista del jugador, o lo contrario. <code>in</code> comprueba si algo está en una lista.</p>`,
   task:"Escribe ganador(jugador, ordenador), que devuelva \"empate\", \"jugador\" u \"ordenador\". Puedes usar gana_a.",
   starter:RPSLS_DICT+"\n\ndef ganador(jugador, ordenador):\n    pass\n", examStarter:RPSLS_DICT+"\n\n",
   check:{cases:[{tests:`reglas = {"tijera": ["papel", "lagarto"], "papel": ["piedra", "spock"], "piedra": ["lagarto", "tijera"], "lagarto": ["spock", "papel"], "spock": ["tijera", "piedra"]}\nfor a in reglas:\n    for b in reglas:\n        if a == b:\n            ok = "empate"\n        elif b in reglas[a]:\n            ok = "jugador"\n        else:\n            ok = "ordenador"\n        assert ganador(a, b) == ok, "ganador('" + a + "', '" + b + "') debería ser '" + ok + "'"`}]},
   hint:"if jugador == ordenador: empate. elif ordenador in gana_a[jugador]: jugador. else: ordenador.",
   solution:RPSLS_DICT+'\n\ndef ganador(jugador, ordenador):\n    if jugador == ordenador:\n        return "empate"\n    elif ordenador in gana_a[jugador]:\n        return "jugador"\n    else:\n        return "ordenador"'},
  {id:"c5s4", type:"code", title:"Juega el ordenador",
   theory:`<p><code>list(gana_a.keys())</code> te da la lista de jugadas sin tener que escribirla otra vez.</p>`,
   task:"Escribe eleccion_ordenador(), que devuelva al azar una de las 5 jugadas.",

   check:{cases:[{tests:`vistas = set(eleccion_ordenador() for _ in range(300))\nassert vistas == {"piedra", "papel", "tijera", "lagarto", "spock"}, "Han salido: " + str(sorted(vistas))`}]},
   hint:"return random.choice(list(gana_a.keys()))",
   solution:"import random\n\n"+RPSLS_DICT+"\n\ndef eleccion_ordenador():\n    return random.choice(list(gana_a.keys()))"},
  {id:"c5s5", type:"code", title:"Una ronda completa", exam:true,
   theory:`<p>Ahora todo junto: pedir la jugada, validarla, que elija el ordenador y anunciar el resultado. Es la práctica de clase casi entera.</p>`,
   task:"Pide la jugada y normalízala. Si no es válida, imprime Jugada no válida y vuelve a pedirla. Luego imprime El ordenador elige <jugada> y el resultado: Ganas tú, Gana el ordenador o Empate.",
   starter:"import random\n\n"+RPSLS_DICT+"\n\n# Escribe aquí tu programa\n",
   examStarter:"import random\n\n# Escribe aquí tu programa\n",
   check:{cases:[{inputs:["fuego","  PIEDRA "],contains:["Jugada no válida","El ordenador elige"],anyOf:[["Ganas tú","Gana el ordenador","Empate"]]},{inputs:["spock"],contains:["El ordenador elige"],absent:["Jugada no válida"],anyOf:[["Ganas tú","Gana el ordenador","Empate"]]}]},
   hint:"Bucle while para validar con: jugada not in gana_a. Después reutiliza la lógica de ganador().",
   solution:"import random\n\n"+RPSLS_DICT+'\n\njugada = input("Tu jugada: ").strip().lower()\nwhile jugada not in gana_a:\n    print("Jugada no válida")\n    jugada = input("Tu jugada: ").strip().lower()\n\nordenador = random.choice(list(gana_a.keys()))\nprint(f"El ordenador elige {ordenador}")\n\nif jugada == ordenador:\n    print("Empate")\nelif ordenador in gana_a[jugada]:\n    print("Ganas tú")\nelse:\n    print("Gana el ordenador")'},
  {id:"c5s6", type:"code", title:"Marcador",
   theory:`<p>Para jugar varias rondas, guarda los puntos en un diccionario y actualízalo después de cada ronda. Un diccionario que pasas a una función se puede modificar dentro de ella.</p>`,
   task:"Escribe actualizar(marcador, resultado): si resultado es \"jugador\" u \"ordenador\", suma 1 a ese marcador; si es \"empate\", no cambia nada. Devuelve el marcador.",
   starter:"def actualizar(marcador, resultado):\n    pass\n",
   check:{cases:[{tests:`m = {"jugador": 0, "ordenador": 0}\nactualizar(m, "jugador")\nactualizar(m, "empate")\nr = actualizar(m, "jugador")\nassert m == {"jugador": 2, "ordenador": 0}, "Tras 2 victorias y 1 empate: " + str(m)\nassert r is m, "Debe devolver el marcador con return"\nactualizar(m, "ordenador")\nassert m["ordenador"] == 1, "Suma también al ordenador"`}]},
   hint:"if resultado != \"empate\": marcador[resultado] += 1. Después, return marcador.",
   solution:'def actualizar(marcador, resultado):\n    if resultado != "empate":\n        marcador[resultado] += 1\n    return marcador'},

 {id:"c6", clase:true, name:"Proyectos tipo examen", desc:"programas completos como los de clase", steps:[
  {id:"c6s1", type:"code", title:"Adivina el número", exam:true,
   theory:`<p>En VSCodium harías <code>secreto = random.randint(1, 100)</code>. Aquí la variable <code>secreto</code> ya existe con un valor fijo para que la app pueda comprobar tu programa.</p>`,
   task:"La variable secreto ya existe. Pide números hasta acertar; tras cada fallo imprime Es mayor o Es menor. Al acertar imprime ¡Acertaste! y después Intentos: <n>",
   starter:"# secreto ya existe\n",
   check:{cases:[{pre:"secreto = 42",inputs:["50","30","42"],contains:["Es menor","Es mayor","¡Acertaste!","Intentos: 3"]},{pre:"secreto = 7",inputs:["7"],contains:["¡Acertaste!","Intentos: 1"],absent:["Es mayor","Es menor"]}]},
   hint:"Lleva un contador de intentos y usa while intento != secreto.",
   solution:'intentos = 0\nintento = None\nwhile intento != secreto:\n    intento = int(input("Tu número: "))\n    intentos += 1\n    if secreto > intento:\n        print("Es mayor")\n    elif secreto < intento:\n        print("Es menor")\nprint("¡Acertaste!")\nprint(f"Intentos: {intentos}")'},
  {id:"c6s2", type:"code", title:"Calculadora con menú", exam:true,
   theory:`<p>Un clásico de examen: menú en bucle, pedir datos, operar y controlar el caso especial de dividir entre cero.</p>`,
   task:"Menú en bucle: 1 sumar, 2 restar, 3 multiplicar, 4 dividir, 5 salir. Para 1–4 pide dos números enteros e imprime Resultado: <x>. Si se divide entre 0, imprime No se puede dividir entre 0. Si la opción no existe, Opción no válida.",
   starter:"", check:{require:["while"], cases:[{inputs:["1","2","3","4","5","0","4","10","4","5"],contains:["Resultado: 5","No se puede dividir entre 0","Resultado: 2.5"]},{inputs:["7","3","6","7","5"],contains:["Opción no válida","Resultado: 42"]}]},
   hint:"Pide los dos números solo si la opción está entre 1 y 4. Comprueba la opción 5 primero para salir con break.",
   solution:'while True:\n    print("1. Sumar  2. Restar  3. Multiplicar  4. Dividir  5. Salir")\n    opcion = input("Opción: ")\n    if opcion == "5":\n        break\n    if opcion not in ["1", "2", "3", "4"]:\n        print("Opción no válida")\n        continue\n    a = int(input("Primer número: "))\n    b = int(input("Segundo número: "))\n    if opcion == "1":\n        print(f"Resultado: {a + b}")\n    elif opcion == "2":\n        print(f"Resultado: {a - b}")\n    elif opcion == "3":\n        print(f"Resultado: {a * b}")\n    elif b == 0:\n        print("No se puede dividir entre 0")\n    else:\n        print(f"Resultado: {a / b}")'},
  {id:"c6s3", type:"code", title:"Gestor de notas", exam:true,
   theory:`<p>Leer datos hasta una palabra de parada (<i>centinela</i>) es muy común: el bucle termina cuando el usuario escribe "fin".</p>`,
   task:"Pide notas (pueden tener decimales) hasta que escriban fin. Imprime Media: <2 decimales>, Nota más alta: <1 decimal> y Aprobados: <cuántas ≥ 5>. Si no hay ninguna nota, imprime solo No hay notas.",
   starter:"", check:{cases:[{inputs:["7","4.5","9","fin"],contains:["Media: 6.83","Nota más alta: 9.0","Aprobados: 2"]},{inputs:["fin"],contains:["No hay notas"],absent:["Media"]}]},
   hint:"Guarda las notas en una lista con append(float(texto)). Al final usa sum, len y max.",
   solution:'notas = []\ntexto = input("Nota (o fin): ")\nwhile texto != "fin":\n    notas.append(float(texto))\n    texto = input("Nota (o fin): ")\n\nif len(notas) == 0:\n    print("No hay notas")\nelse:\n    print(f"Media: {sum(notas) / len(notas):.2f}")\n    print(f"Nota más alta: {max(notas):.1f}")\n    aprobados = 0\n    for n in notas:\n        if n >= 5:\n            aprobados += 1\n    print(f"Aprobados: {aprobados}")'},
  {id:"c6s4", type:"code", title:"Contraseña segura", exam:true,
   theory:`<p>Métodos útiles para revisar caracteres: <code>c.isupper()</code>, <code>c.islower()</code>, <code>c.isdigit()</code>. Recorre la contraseña con un <code>for</code> y usa variables bandera (True/False).</p>`,
   task:"Escribe es_segura(contrasena): True si tiene al menos 8 caracteres, alguna mayúscula, alguna minúscula y algún número; si no, False.",
   starter:"def es_segura(contrasena):\n    pass\n",
   check:{cases:[{tests:`assert es_segura("Abcdefg1") == True, "Abcdefg1 cumple todo"\nassert es_segura("abcdefg1") == False, "abcdefg1 no tiene mayúscula"\nassert es_segura("ABCDEFG1") == False, "ABCDEFG1 no tiene minúscula"\nassert es_segura("Abcdefgh") == False, "Abcdefgh no tiene número"\nassert es_segura("Ab1") == False, "Ab1 es demasiado corta"`}]},
   hint:"Empieza con tiene_mayus = False, etc., y ponlas a True dentro del for.",
   solution:"def es_segura(contrasena):\n    if len(contrasena) < 8:\n        return False\n    mayus = False\n    minus = False\n    num = False\n    for c in contrasena:\n        if c.isupper():\n            mayus = True\n        elif c.islower():\n            minus = True\n        elif c.isdigit():\n            num = True\n    return mayus and minus and num"},
  {id:"c6s5", type:"code", title:"El ahorcado",
   theory:`<p>La pieza clave del ahorcado es mostrar la palabra con huecos. <code>" ".join(lista)</code> une una lista de textos con espacios.</p>`,
   task:"Escribe mostrar(palabra, letras): cada letra acertada se ve y las demás son _, todo separado por espacios. Y completa(palabra, letras): True si ya se han adivinado todas.",
   starter:"def mostrar(palabra, letras):\n    pass\n\ndef completa(palabra, letras):\n    pass\n",
   check:{cases:[{tests:`assert mostrar("python", ["p", "o"]) == "p _ _ _ o _", "Esperaba 'p _ _ _ o _' y tengo '" + str(mostrar("python", ["p", "o"])) + "'"\nassert mostrar("sol", []) == "_ _ _", "Sin letras: '_ _ _'"\nassert completa("sol", ["s", "o", "l"]) == True, "sol con s, o, l está completa"\nassert completa("sol", ["s"]) == False, "sol solo con s no está completa"`}]},
   hint:"Construye una lista: añade la letra si está en letras, y \"_\" si no. Luego return \" \".join(lista).",
   solution:'def mostrar(palabra, letras):\n    partes = []\n    for c in palabra:\n        if c in letras:\n            partes.append(c)\n        else:\n            partes.append("_")\n    return " ".join(partes)\n\ndef completa(palabra, letras):\n    for c in palabra:\n        if c not in letras:\n            return False\n    return True'},
  {id:"c6s6", type:"code", title:"Lotería primitiva", exam:true,
   theory:`<p>Generar números al azar <b>sin repetir</b> se hace con un bucle que solo añade el número si no estaba ya: <code>if n not in lista</code>. <code>sorted()</code> devuelve la lista ordenada.</p>`,
   task:"Escribe combinacion(), que devuelva una lista ordenada de 6 números distintos entre 1 y 49.",
   starter:"import random\n\ndef combinacion():\n    pass\n",
   check:{cases:[{tests:`for _ in range(50):\n    c = combinacion()\n    assert len(c) == 6, "Deben ser 6 números: " + str(c)\n    assert len(set(c)) == 6, "No puede haber repetidos: " + str(c)\n    assert all(1 <= n <= 49 for n in c), "Todos entre 1 y 49: " + str(c)\n    assert c == sorted(c), "La lista debe ir ordenada: " + str(c)\nassert len(set(str(combinacion()) for _ in range(20))) > 1, "Cada combinación debe ser al azar"`}]},
   hint:"while len(numeros) < 6: n = random.randint(1, 49) y añádelo si no está.",
   solution:"import random\n\ndef combinacion():\n    numeros = []\n    while len(numeros) < 6:\n        n = random.randint(1, 49)\n        if n not in numeros:\n            numeros.append(n)\n    return sorted(numeros)"},
 ]},
];

const KEY = "pyquest-v1";
const fresh = () => ({xp:0, coins:20, done:{}, streak:{count:0,last:null}, ach:{}, stats:{runs:0, clean:0, perfectRun:0, blitzBest:0, parsons:{}, exams:0, examBest:null}});
let S = fresh();
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(fresh(), JSON.parse(raw)); }catch(e){}
S.stats = Object.assign(fresh().stats, S.stats||{});
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function levelInfo(xp){
  let lvl=1, need=100, base=0;
  while(xp >= base+need){ base+=need; lvl++; need+=50; }
  return {lvl, into:xp-base, need, title:LEVELS[Math.min(lvl-1, LEVELS.length-1)]};
}
const allSteps = WORLDS.flatMap((w,wi)=>w.steps.map((s,si)=>({...s, wi, si})));
const worldDone = wi => WORLDS[wi].steps.every(s=>S.done[s.id]);
const worldOpen = wi => wi===0 || worldDone(wi-1) || WORLDS[wi].steps.some(s=>S.done[s.id]);
const stepOpen = (wi,si) => !!S.done[WORLDS[wi].steps[si].id] || (worldOpen(wi) && (si===0 || !!S.done[WORLDS[wi].steps[si-1].id]));
const worldDoneId = id => WORLDS.findIndex(w=>w.id===id) >= 0 && worldDone(WORLDS.findIndex(w=>w.id===id));
const EXAM_STEPS = allSteps => allSteps.filter(s=>s.exam);
const nextStep = () => allSteps.find(s=>!S.done[s.id] && stepOpen(s.wi,s.si));

function todayStr(d=new Date()){ return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function touchStreak(){
  const t = todayStr(); if(S.streak.last===t) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  S.streak.count = (S.streak.last===todayStr(y)) ? S.streak.count+1 : 1;
  S.streak.last = t;
}
function displayStreak(){
  if(!S.streak.last) return 0;
  const y = new Date(); y.setDate(y.getDate()-1);
  return (S.streak.last===todayStr() || S.streak.last===todayStr(y)) ? S.streak.count : 0;
}

function gainXP(n, why){
  if(n<=0) return;
  const before = levelInfo(S.xp).lvl;
  S.xp += n; touchStreak();
  toast(`+${n} XP · ${why}`);
  const after = levelInfo(S.xp);
  if(after.lvl>before){ setTimeout(()=>{ toast(`¡Nivel ${after.lvl}! Ahora eres ${after.title}`, true); confetti(140); }, 500); }
  checkAch(); save(); renderHud();
}
function unlock(id){
  if(S.ach[id]) return;
  S.ach[id] = Date.now();
  const a = ACH.find(x=>x.id===id);
  setTimeout(()=>{ toast(`Logro desbloqueado: ${a.t}`, true); confetti(80); }, 900);
}
function checkAch(){
  if(Object.keys(S.done).length>=1) unlock("first");
  if(worldDone(0)) unlock("w1");
  if(WORLDS.filter((_,i)=>worldDone(i)).length>=7) unlock("w4");
  if(WORLDS.every((_,i)=>worldDone(i))) unlock("w8");
  if(worldDoneId("c5")) unlock("rpsls");
  if(WORLDS.every((w,i)=>!w.clase || worldDone(i))) unlock("clase");
  if(S.stats.exams>=1) unlock("exam1");
  if(S.stats.exams>=5) unlock("exam5");
  if(S.stats.clean>=5) unlock("clean5");
  if(S.stats.perfectRun>=5) unlock("perfect5");
  if(S.streak.count>=3) unlock("streak3");
  if(S.streak.count>=7) unlock("streak7");
  if(S.stats.blitzBest>=10) unlock("blitz10");
  if(S.stats.blitzBest>=20) unlock("blitz20");
  if(Object.keys(S.stats.parsons).length>=3) unlock("parsons3");
  if(S.stats.runs>=25) unlock("runs25");
  if(levelInfo(S.xp).lvl>=5) unlock("lvl5");
  save();
}

/* Confeti */
const fx = $("#fx"), ctx = fx.getContext("2d"); let parts=[], fxOn=false;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(n=90){
  if(reduce) return;
  const dpr = devicePixelRatio||1; fx.width = innerWidth*dpr; fx.height = innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cs = getComputedStyle(document.documentElement);
  const cols = [cs.getPropertyValue("--yellow"), cs.getPropertyValue("--blue"), "#F08A24", cs.getPropertyValue("--good")];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*120, y:innerHeight*.45, vx:(Math.random()-.5)*12, vy:-Math.random()*12-4, r:Math.random()*6+3, c:cols[i%4], a:Math.random()*6, life:90+Math.random()*40});
  if(!fxOn){ fxOn=true; requestAnimationFrame(tick); }
}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p=>p.life-->0);
  for(const p of parts){ p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.a+=.2; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); }
  if(parts.length) requestAnimationFrame(tick); else { fxOn=false; ctx.clearRect(0,0,innerWidth,innerHeight); }
}

/* ======================= Python (Skulpt) ======================= */
function fmtErr(e, preLines, userLines){
  let s = (e && e.toString) ? e.toString() : String(e);
  if(/TimeLimitError|run time limit|exceeded/i.test(s)) return "Tu programa tardó demasiado. ¿Puede que tengas un bucle infinito?";
  s = s.replace(/on line (\d+)/, (m, n)=>{
    n = +n - preLines;
    if(n>=1 && n<=userLines) return "(línea "+n+")";
    return "(en las comprobaciones)";
  });
  const tips = [
    [/^NameError/, "Pista: estás usando un nombre que no existe. ¿Está bien escrito?"],
    [/^SyntaxError|^ParseError/, "Pista: revisa paréntesis, comillas y los dos puntos (:) al final de if, for, def…"],
    [/^IndentationError/, "Pista: el código dentro de un bloque va indentado con 4 espacios."],
    [/^TypeError/, "Pista: estás mezclando tipos (por ejemplo, texto + número)."],
    [/^AssertionError/, ""],
  ];
  for(const [re,tip] of tips) if(re.test(s) && tip) return s+"\n"+tip;
  return s.replace(/^AssertionError:\s*/, "No pasa la comprobación: ");
}
function runPy(code, preLines=0, userLines=9999, inputs=null){
  return new Promise(resolve=>{
    if(!window.Sk){ resolve({ok:false,out:"",err:"No se ha podido cargar el intérprete de Python. Revisa tu conexión y recarga la página."}); return; }
    let out = "";
    const queue = inputs ? inputs.slice() : [];
    Sk.configure({
      output: t=>{ out+=t; }, __future__: Sk.python3, execLimit: 4000, yieldLimit: 200,
      read: x=>{ if(Sk.builtinFiles===undefined || Sk.builtinFiles.files[x]===undefined) throw "Archivo no encontrado: '"+x+"'"; return Sk.builtinFiles.files[x]; },
      inputfun: prompt=>{
        if(!queue.length) throw new Sk.builtin.RuntimeError(
          inputs===null ? "Este reto no usa input(): trabaja con los datos que ya existen."
          : inputs.length ? "El programa ha pedido más datos de los que había preparados. ¿Falta un break o la condición de salida?"
          : "Este programa usa input(). Escribe las respuestas en el cuadro de entradas, una por línea.");
        const v = queue.shift(); out += (prompt||"") + v + "\n"; return v;
      },
      inputfunTakesPrompt:true
    });
    S.stats.runs++; save();
    Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<stdin>", false, code, true))
      .then(()=>resolve({ok:true,out}), e=>resolve({ok:false,out,err:fmtErr(e, preLines, userLines)}));
  });
}
const norm = s => String(s).replace(/[ \t]+$/gm,"").replace(/\s+$/,"").replace(/^\s+/,"");

/* Ejecuta el código del alumno contra todas las pruebas de un reto */
function caseLabel(c){
  const parts = [];
  if(c.pre) parts.push("con " + c.pre);
  if(c.inputs) parts.push("escribiendo " + c.inputs.map(x=>"«"+x+"»").join(", "));
  return parts.join(" y ");
}
async function runCase(code, c){
  const pre = c.pre ? c.pre+"\n" : "";
  return runPy(pre + code + (c.tests ? "\n"+c.tests : ""), c.pre ? c.pre.split("\n").length : 0, code.split("\n").length, c.inputs || null);
}
async function evaluate(s, code){
  const ck = s.check;
  for(const f of (ck.forbid||[])) if(code.includes(f)) return {ok:false, msg:`En este reto no puedes usar ${f.replace("(","")}.`, extra:"Hazlo a mano: es justo lo que se practica aquí."};
  if(ck.require){
    const has = ck.require.map(r=>code.includes(r));
    if(ck.requireAny ? !has.some(Boolean) : !has.every(Boolean)) return {ok:false, msg:"Te falta usar la herramienta de este reto.", extra:"Necesitas: "+ck.require.join(ck.requireAny?" o ":" y ")};
  }
  let first = null;
  for(const c of ck.cases){
    const r = await runCase(code, c);
    if(!first) first = r;
    const label = caseLabel(c);
    const where = label ? `Probando ${label}.` : "";
    if(!r.ok) return {ok:false, out:r, msg:r.err.split("\n")[0], extra:[where, r.err.split("\n").slice(1).join("\n")].filter(Boolean).join("\n")};
    const o = norm(r.out);
    if(c.expected!==undefined && o!==norm(c.expected))
      return {ok:false, out:r, msg:"La salida no coincide.", extra:`${where}\nEsperaba:\n${c.expected}\n\nHas impreso:\n${o||"(nada)"}`.trim()};
    for(const t of (c.contains||[])) if(!r.out.includes(t))
      return {ok:false, out:r, msg:`Falta en la salida: «${t}»`, extra:`${where}\nTu programa imprimió:\n${o||"(nada)"}`.trim()};
    for(const t of (c.absent||[])) if(r.out.includes(t))
      return {ok:false, out:r, msg:`No debería aparecer: «${t}»`, extra:`${where}\nTu programa imprimió:\n${o}`.trim()};
    for(const g of (c.anyOf||[])) if(!g.some(t=>r.out.includes(t)))
      return {ok:false, out:r, msg:`Debería aparecer uno de: ${g.map(t=>"«"+t+"»").join(", ")}`, extra:`${where}\nTu programa imprimió:\n${o||"(nada)"}`.trim()};
  }
  return {ok:true, out:first, n:ck.cases.length};
}
async function copyCode(text, btn){
  try{ await navigator.clipboard.writeText(text); btn.textContent = "¡Copiado!"; }
  catch(e){ btn.textContent = "Selecciónalo y cópialo"; }

}

/* Editor con numeración de líneas */
function makeEditor(host, initial){
  host.innerHTML = `<div class="editor"><div class="gutter" aria-hidden="true"></div><textarea spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Editor de código Python"></textarea></div>`;
  const ta = host.querySelector("textarea"), gut = host.querySelector(".gutter");
  ta.id = "ed-"+(host.id||"main");
  ta.value = initial;
  const sync = ()=>{ const n = ta.value.split("\n").length; gut.textContent = Array.from({length:Math.max(n,9)},(_,i)=>i+1).join("\n"); gut.scrollTop = ta.scrollTop; };
  ta.addEventListener("input", sync); ta.addEventListener("scroll", ()=>gut.scrollTop=ta.scrollTop);
  ta.addEventListener("keydown", e=>{
    const v = ta.value, a = ta.selectionStart, b = ta.selectionEnd;
    if(e.key==="Tab"){ e.preventDefault(); ta.setRangeText("    ", a, b, "end"); sync(); }
    else if(e.key==="Enter" && !e.ctrlKey && !e.metaKey){
      e.preventDefault();
      const lineStart = v.lastIndexOf("\n", a-1)+1, line = v.slice(lineStart, a);
      let ind = line.match(/^ */)[0]; if(/:\s*$/.test(line)) ind += "    ";
      ta.setRangeText("\n"+ind, a, b, "end"); sync();
    }
    else if(e.key==="Backspace" && a===b){
      const lineStart = v.lastIndexOf("\n", a-1)+1, before = v.slice(lineStart, a);
      if(before.length && /^ +$/.test(before) && before.length%4===0){ e.preventDefault(); ta.setRangeText("", a-4, a, "end"); sync(); }
    }
  });
  sync();
  return ta;
}

function renderChallenge(id){
  const s = allSteps.find(x=>x.id===id), w = WORLDS[s.wi];

  const A = attempt[id], wasDone = !!S.done[id];
  const reward = s.type==="quiz" ? 10 : 25;
  app.innerHTML = `
  <div class="crumbs"><button class="btn sm ghost" id="back">← Mapa</button><strong>Mundo ${s.wi+1} · ${esc(w.name)}</strong>
    <div class="steps" aria-label="Progreso del mundo">${w.steps.map((x,i)=>`<i class="${x.id===id?"c":S.done[x.id]?"d":""}"></i>`).join("")}</div></div>
  <div class="challenge">
    <article class="panel theory">
      <div class="eyebrow">${s.type==="quiz"?"Test rápido":"Reto de código"} · ${s.si+1} de ${w.steps.length}${s.badge||w.badge?` · <span class="tag-clase">${esc(s.badge||w.badge)}</span>`:w.clase?` · <span class="tag-clase">Entra en clase</span>`:""}</div>
      <h2>${esc(s.title)}</h2>${s.theory}
      ${s.type==="code"?`<div class="task"><h3>Tu misión</h3><p>${esc(s.task)}</p></div>`:""}
      <div class="reward">${wasDone?`<span>Ya superado · modo repaso</span>`:`<span>+${reward} XP</span><span>+5 escamas</span>${s.type==="code"?`<span>+10 XP extra a la primera y sin pista</span>`:""}`}</div>
    </article>
    <section class="panel" id="work"></section>
  </div>`;
  $("#back").onclick = ()=>go("map");
  const work = $("#work");

  const onSuccess = () => {
    const first = A.tries===0, clean = !A.hint && !A.sol;
    if(!wasDone){
      let xp = reward; if(s.type==="code" && first && clean) xp += 10; if(A.sol) xp = Math.round(xp/2);
      S.done[id] = {t:Date.now(), first, clean};
      S.coins += 5;
      if(s.type==="code" && clean) S.stats.clean++;
      S.stats.perfectRun = first ? S.stats.perfectRun+1 : 0;
      gainXP(xp, first?"¡a la primera!":"reto superado");
    } else { touchStreak(); save(); renderHud(); }

    const fb = work.querySelector(".feedback");

    if(nx){ const b=document.createElement("button"); b.className="btn blue sm"; b.textContent="Siguiente: "+nx.title; b.onclick=()=>go("challenge", nx.id); row.appendChild(b); }
    const m=document.createElement("button"); m.className="btn ghost sm"; m.textContent="Volver al mapa"; m.onclick=()=>go("map"); row.appendChild(m);
  };

  if(s.type==="quiz"){
    work.innerHTML = `${s.code?`<div class="eyebrow">Lee el código</div><pre class="snippet" style="margin-top:8px">${esc(s.code)}</pre>`:""}
      <p style="font-weight:700;margin:4px 0 10px">${esc(s.q)}</p>
      <div class="options">${s.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div><div id="fbq"></div>`;
    work.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const i = +b.dataset.i;
      if(i===s.answer){
        b.classList.add("right"); work.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        $("#fbq").innerHTML = `<div class="feedback ok"><div class="body">¡Correcto!<small>${esc(s.explain)}</small></div></div>`;
        onSuccess();
      } else {
        A.tries++; b.classList.add("wrong","flash-ko"); b.disabled = true;
        $("#fbq").innerHTML = `<div class="feedback ko"><div class="body">No es esa. Vuelve a leer el código línea a línea.</div></div>`;
      }
    });
    return;
  }

  work.innerHTML = `<div id="edhost"></div>

    if(!wasDone){ S.coins-=5; save(); renderHud(); } A.hint=true; showHint();

  };

function renderBlitz(){
  let time = 60, score = 0, combo = 0, answered = 0, bag = [];

  app.innerHTML = `<div class="crumbs"><button class="btn sm ghost" id="back">← Minijuegos</button><strong>Contrarreloj</strong></div>
    <div class="panel" id="ta"><div class="ta-top"><div class="timer" id="tm">60</div><div class="timebar"><i id="tb" style="width:100%"></i></div><div class="score" id="sc">0 pts</div><span class="combo" id="cb" hidden></span></div>

  const show = ()=>{
    cur = draw();

    $("#qo").querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.i, b));
  };

    if(!blitzT) return;

    const panel = $("#ta"); panel.classList.remove("flash-ok","flash-ko"); void panel.offsetWidth;
    if(i===cur[2]){ combo++; score += combo>=5?3:combo>=3?2:1; panel.classList.add("flash-ok"); }

    $("#sc").textContent = score+" pts";
    const cb = $("#cb"); cb.hidden = combo<3; cb.textContent = "Racha x"+(combo>=5?3:2);
    show();
  };
  const end = ()=>{
    stopBlitz();
    const rec = score > S.stats.blitzBest;
    if(rec) S.stats.blitzBest = score;
    const xp = score*3, coins = Math.floor(score/2);
    S.coins += coins; save();
    $("#ta").innerHTML = `<div class="big-result"><div class="eyebrow">${rec&&score>0?"¡Nuevo récord!":"Tiempo"}</div><div class="n">${score}</div><p>puntos con ${answered} respuestas · +${coins} escamas</p>

    if(xp) gainXP(xp, "Contrarreloj"); else { checkAch(); renderHud(); }
    if(rec && score>0) confetti(120);
  };
  show();
  blitzT = setInterval(()=>{
    time--; $("#tm").textContent = time; $("#tm").classList.toggle("low", time<=10);
    $("#tb").style.width = (time/60*100)+"%";
    if(time<=0) end();
  }, 1000);
}

function renderParsons(pid){

  let pool = P.lines.map((l,i)=>({l,i})).sort(()=>Math.random()-.5), placed = [];
  if(pool.every((x,k)=>x.i===k)) pool.reverse();
  app.innerHTML = `<div class="crumbs"><button class="btn sm ghost" id="back">← Minijuegos</button><strong>Ordena el código</strong></div>

  $("#back").onclick = ()=>go("games");
  app.querySelectorAll(".ptabs button").forEach(b=>b.onclick=()=>go("parsons", b.dataset.p));

    $("#pool").innerHTML = pool.length ? pool.map((x,k)=>`<button class="piece" data-k="${k}">${esc(x.l)}</button>`).join("") : `<div class="empty">¡Has colocado todas las piezas!</div>`;
    $("#tgt").innerHTML = placed.length ? placed.map((x,k)=>`<button class="piece" data-k="${k}">${esc(x.l)}</button>`).join("") : `<div class="empty">Toca las piezas en el orden correcto</div>`;
    $("#pool").querySelectorAll(".piece").forEach(b=>b.onclick=()=>{ placed.push(pool.splice(+b.dataset.k,1)[0]); draw(); });
    $("#tgt").querySelectorAll(".piece").forEach(b=>b.onclick=()=>{ pool.push(placed.splice(+b.dataset.k,1)[0]); draw(); });
  };
  draw();
  $("#preset").onclick = ()=>go("parsons", P.id);
  $("#pchk").onclick = async ()=>{
    const fb = $("#pfb");
    if(pool.length){ fb.innerHTML = `<div class="feedback ko"><div class="body">Todavía quedan ${pool.length} piezas por colocar.</div></div>`; return; }
    const ok = placed.every((x,k)=>x.l===P.lines[k]);
    if(!ok){
      const firstBad = placed.findIndex((x,k)=>x.l!==P.lines[k]);
      fb.innerHTML = `<div class="feedback ko"><div class="body">El orden no es correcto.<small>Las primeras ${firstBad} líneas están bien; revisa a partir de la línea ${firstBad+1}.</small></div></div>`; return;
    }
    const r = await runPy(P.lines.join("\n"), 0, 9999, P.inputs || null);
    const o = $("#pout"); o.className="console"; o.textContent = r.ok ? r.out : r.err;
    const first = !S.stats.parsons[P.id];
    S.stats.parsons[P.id] = Date.now();
    fb.innerHTML = `<div class="feedback ok"><div class="body">¡Programa en orden!${first?"":"<small>Ya lo habías resuelto: modo repaso.</small>"}</div></div>`;
    if(first){ S.coins += 5; gainXP(15, "puzzle ordenado"); } else { save(); }
    confetti(80);
    app.querySelectorAll(".ptabs button").forEach(b=>{ if(S.stats.parsons[b.dataset.p]) b.classList.add("done"); });

  };
}

  ta.addEventListener("keydown", e=>{ if(e.key==="Enter" && (e.ctrlKey||e.metaKey)){ e.preventDefault(); run(); }});
  $("#cclr").onclick = ()=>{ $("#cout").className="console"; $("#cout").innerHTML=`<span class="ph">La salida aparecerá aquí.</span>`; };
  app.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{ ta.value = consoleCode = EXAMPLES[b.dataset.ex]; ta.dispatchEvent(new Event("input")); $("#cin").value = consoleInputs = EXAMPLE_INPUTS[b.dataset.ex] || ""; });
}

renderHud();
go("map");
</script>
